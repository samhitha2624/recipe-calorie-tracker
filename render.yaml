# One-click deploy on Render: New > Blueprint, pick this repo.
services:
  - type: web
    name: recipe-calorie-tracker
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FDC_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: recipe-calorie-db
          property: connectionString

databases:
  - name: recipe-calorie-db
    plan: free
